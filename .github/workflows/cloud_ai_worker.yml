name: 24-7 Cloud AI Paper Trading & Win-Rate Evolution

on:
  schedule:
    # 내 컴퓨터가 꺼져 있는 10일 내내 30분마다 무료 클라우드 서버에서 자동 실행
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: ai-stock-cloud-worker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-ai-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Get current KST date for cache key
        id: kst
        env:
          TZ: Asia/Seoul
        run: echo "today=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Cache 5-year market data bundles for fast cloud runs
        uses: actions/cache@v4
        with:
          path: .cache
          key: market-bundle-cache-${{ runner.os }}-${{ steps.kst.outputs.today }}
          restore-keys: |
            market-bundle-cache-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1) Check live stock prices & execute auto safety-brake / take-profit
        env:
          TZ: Asia/Seoul
        run: |
          python live_paper_worker.py --once --auto-guard

      - name: 2) Evolve win-rate generations, grade due predictions & update 100k KRW starter pack
        env:
          TZ: Asia/Seoul
        run: |
          python evolve_winrate_worker.py --once --generations 6 --refresh-screening

      - name: 3) Save accumulated data back to repository
        run: |
          git config user.name "AI-Stock-Cloud-Worker"
          git config user.email "ai-worker@users.noreply.github.com"
          git add data/ outputs/ saved_models/
          git diff --staged --quiet || (git commit -m "chore(auto): update live wallet, evolved win-rate & 100k starter pack" && git pull --rebase -X theirs && git push)
